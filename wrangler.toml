# ==============================================================================
# Cloudflare Pages / Workers Configuration for CloudSentry
# ==============================================================================

name = "cloudsentry"
main = "worker.js"
compatibility_date = "2024-09-23"

# Static Assets for Cloudflare Workers
[assets]
directory = "src/main/resources/static"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Static Output for Cloudflare Pages
pages_build_output_dir = "src/main/resources/static"

# Environment variables
[vars]
ENVIRONMENT = "production"
PLATFORM = "CloudSentry Observability Platform"
# API_BACKEND_URL = "https://api.yourdomain.com"
